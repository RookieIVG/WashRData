name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    # Pinned: Playwright 1.56 cannot install its browsers on newer Ubuntu images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      # The panel in a real browser, with the data pytest wrote from a real Home Assistant.
      - run: npm install --no-save playwright@1.56.1
      # WebKit is the engine of every iPhone browser, including the Home Assistant app.
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/frontend/panel_smoke.mjs
        env:
          BROWSERS: chromium,webkit

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # The HACS action only validates public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Only needed to be listed in the HACS default store; custom repositories work without.
          ignore: brands description topics

  release:
    # Every new version in the manifest on main becomes a release, once the checks pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/washrdata/manifest.json)
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version exists"
            exit 0
          fi
          # Release notes: the roadmap row of this version in the concept.
          notes=$(grep -F "| **$version** |" docs/KONZEPT.md | sed -E 's/^\| \*\*[^*]+\*\* \| (.*) \|$/\1/')
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" \
            --notes "${notes:-Version $version}"
